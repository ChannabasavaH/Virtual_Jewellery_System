<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldNath" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b38f24"/>
    </linearGradient>
    <radialGradient id="rubyNath" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#800020"/>
    </radialGradient>
    <radialGradient id="pearlNath" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#dcdde1"/>
    </radialGradient>
  </defs>

  <!-- Main Hoop Circle (Nath Ring) -->
  <circle cx="70" cy="80" r="45" fill="none" stroke="url(#goldNath)" stroke-width="3"/>

  <!-- Intricate Cluster Gem on Hoop -->
  <g transform="translate(105, 105)">
    <circle cx="0" cy="0" r="10" fill="url(#rubyNath)" stroke="url(#goldNath)" stroke-width="1.5"/>
    <circle cx="0" cy="-14" r="3.5" fill="url(#pearlNath)"/>
    <circle cx="14" cy="0" r="3.5" fill="url(#pearlNath)"/>
    <circle cx="0" cy="14" r="3.5" fill="url(#pearlNath)"/>
    <circle cx="-14" cy="0" r="3.5" fill="url(#pearlNath)"/>
    <!-- Small Teardrop Ruby Hanging from Ring -->
    <path d="M 0,14 Q 5,28 0,34 Q -5,28 0,14 Z" fill="url(#rubyNath)"/>
  </g>

  <!-- Graceful Hair/Ear Extension Chain -->
  <path d="M 112,70 Q 150,55 190,40" fill="none" stroke="url(#goldNath)" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="130" cy="62" r="3" fill="url(#pearlNath)"/>
  <circle cx="155" cy="53" r="3" fill="url(#pearlNath)"/>
  <circle cx="178" cy="44" r="3" fill="url(#pearlNath)"/>
</svg>
