<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa841e"/>
    </linearGradient>
    <radialGradient id="rubyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="40%" stop-color="#d63031"/>
      <stop offset="100%" stop-color="#800020"/>
    </radialGradient>
    <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#55efc4"/>
      <stop offset="40%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#006266"/>
    </radialGradient>
    <radialGradient id="pearlGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#dcdde1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Curved Gold Band -->
  <path d="M 50,40 Q 250,140 450,40 Q 250,190 50,40 Z" fill="url(#goldGrad1)" stroke="#8c6d15" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Intricate Kundan Panel Arc -->
  <path d="M 70,55 Q 250,150 430,55 L 420,80 Q 250,185 80,80 Z" fill="url(#goldGrad1)" stroke="#b38f24" stroke-width="1.5"/>

  <!-- Inset Gemstones along Band -->
  <!-- Left Side Gems -->
  <circle cx="100" cy="72" r="7" fill="url(#emeraldGrad)" stroke="url(#goldGrad1)" stroke-width="1.5"/>
  <circle cx="130" cy="85" r="8" fill="url(#rubyGrad)" stroke="url(#goldGrad1)" stroke-width="1.5"/>
  <circle cx="165" cy="98" r="9" fill="url(#emeraldGrad)" stroke="url(#goldGrad1)" stroke-width="1.5"/>
  <circle cx="205" cy="110" r="10" fill="url(#rubyGrad)" stroke="url(#goldGrad1)" stroke-width="1.5"/>

  <!-- Center Focal Medallion -->
  <g transform="translate(250, 130)">
    <!-- Outer Gold Sunburst -->
    <path d="M 0,-40 L 10,-25 L 25,-30 L 18,-14 L 35,-5 L 20,5 L 30,20 L 12,18 L 15,35 L 0,22 L -15,35 L -12,18 L -30,20 L -20,5 L -35,-5 L -18,-14 L -25,-30 L -10,-25 Z" fill="url(#goldGrad1)" stroke="#8c6d15" stroke-width="1.5"/>
    <!-- Center Ruby -->
    <circle cx="0" cy="0" r="16" fill="url(#rubyGrad)" stroke="url(#goldGrad1)" stroke-width="2"/>
    <!-- Surrounding Pearls -->
    <circle cx="0" cy="-24" r="4.5" fill="url(#pearlGrad)"/>
    <circle cx="17" cy="-17" r="4.5" fill="url(#pearlGrad)"/>
    <circle cx="24" cy="0" r="4.5" fill="url(#pearlGrad)"/>
    <circle cx="17" cy="17" r="4.5" fill="url(#pearlGrad)"/>
    <circle cx="0" cy="24" r="4.5" fill="url(#pearlGrad)"/>
    <circle cx="-17" cy="17" r="4.5" fill="url(#pearlGrad)"/>
    <circle cx="-24" cy="0" r="4.5" fill="url(#pearlGrad)"/>
    <circle cx="-17" cy="-17" r="4.5" fill="url(#pearlGrad)"/>
  </g>

  <!-- Right Side Gems -->
  <circle cx="295" cy="110" r="10" fill="url(#rubyGrad)" stroke="url(#goldGrad1)" stroke-width="1.5"/>
  <circle cx="335" cy="98" r="9" fill="url(#emeraldGrad)" stroke="url(#goldGrad1)" stroke-width="1.5"/>
  <circle cx="370" cy="85" r="8" fill="url(#rubyGrad)" stroke="url(#goldGrad1)" stroke-width="1.5"/>
  <circle cx="400" cy="72" r="7" fill="url(#emeraldGrad)" stroke="url(#goldGrad1)" stroke-width="1.5"/>

  <!-- Hanging Pearl Beads & Ruby Drops Along Bottom Arc -->
  <!-- Center Drop -->
  <g transform="translate(250, 175)">
    <line x1="0" y1="0" x2="0" y2="25" stroke="url(#goldGrad1)" stroke-width="2"/>
    <circle cx="0" cy="12" r="4" fill="url(#pearlGrad)"/>
    <path d="M 0,25 Q 10,45 0,55 Q -10,45 0,25 Z" fill="url(#rubyGrad)" stroke="url(#goldGrad1)" stroke-width="1"/>
  </g>
  <!-- Left Drops -->
  <g transform="translate(200, 160)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="url(#goldGrad1)" stroke-width="1.5"/>
    <circle cx="0" cy="10" r="3.5" fill="url(#pearlGrad)"/>
    <path d="M 0,20 Q 8,36 0,44 Q -8,36 0,20 Z" fill="url(#emeraldGrad)" stroke="url(#goldGrad1)" stroke-width="1"/>
  </g>
  <g transform="translate(150, 140)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="url(#goldGrad1)" stroke-width="1.5"/>
    <circle cx="0" cy="9" r="3.5" fill="url(#pearlGrad)"/>
    <path d="M 0,18 Q 7,32 0,40 Q -7,32 0,18 Z" fill="url(#rubyGrad)" stroke="url(#goldGrad1)" stroke-width="1"/>
  </g>
  <g transform="translate(105, 115)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="url(#goldGrad1)" stroke-width="1.5"/>
    <circle cx="0" cy="8" r="3" fill="url(#pearlGrad)"/>
    <path d="M 0,15 Q 6,28 0,35 Q -6,28 0,15 Z" fill="url(#emeraldGrad)" stroke="url(#goldGrad1)" stroke-width="1"/>
  </g>

  <!-- Right Drops -->
  <g transform="translate(300, 160)">
    <line x1="0" y1="0" x2="0" y2="20" stroke="url(#goldGrad1)" stroke-width="1.5"/>
    <circle cx="0" cy="10" r="3.5" fill="url(#pearlGrad)"/>
    <path d="M 0,20 Q 8,36 0,44 Q -8,36 0,20 Z" fill="url(#emeraldGrad)" stroke="url(#goldGrad1)" stroke-width="1"/>
  </g>
  <g transform="translate(350, 140)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="url(#goldGrad1)" stroke-width="1.5"/>
    <circle cx="0" cy="9" r="3.5" fill="url(#pearlGrad)"/>
    <path d="M 0,18 Q 7,32 0,40 Q -7,32 0,18 Z" fill="url(#rubyGrad)" stroke="url(#goldGrad1)" stroke-width="1"/>
  </g>
  <g transform="translate(395, 115)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="url(#goldGrad1)" stroke-width="1.5"/>
    <circle cx="0" cy="8" r="3" fill="url(#pearlGrad)"/>
    <path d="M 0,15 Q 6,28 0,35 Q -6,28 0,15 Z" fill="url(#emeraldGrad)" stroke="url(#goldGrad1)" stroke-width="1"/>
  </g>
</svg>
