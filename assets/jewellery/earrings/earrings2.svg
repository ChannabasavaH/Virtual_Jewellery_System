<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="160" height="260">
  <defs>
    <linearGradient id="plat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="sapphire" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="dia" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </radialGradient>
  </defs>

  <!-- Top Stud -->
  <circle cx="80" cy="35" r="16" fill="url(#sapphire)" stroke="url(#plat)" stroke-width="2"/>
  <circle cx="80" cy="35" r="22" fill="none" stroke="url(#plat)" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Middle Connector Links -->
  <polygon points="80,60 92,75 80,90 68,75" fill="url(#dia)" stroke="url(#plat)" stroke-width="1.5"/>
  <polygon points="80,95 95,115 80,135 65,115" fill="url(#dia)" stroke="url(#plat)" stroke-width="1.5"/>

  <!-- Large Sapphire Teardrop Main Drop -->
  <g transform="translate(80, 190)">
    <path d="M 0,-45 Q 40,0 0,45 Q -40,0 0,-45 Z" fill="url(#sapphire)" stroke="url(#plat)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="10" fill="url(#dia)"/>
  </g>
</svg>
